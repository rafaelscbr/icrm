<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Souza Imobiliária</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- PWA — Android / Chrome -->
    <meta name="theme-color" content="#0F1730" />

    <!-- Fontes Souza Imobiliária -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Hanken+Grotesk:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA — iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Souza Imobiliária" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Descrição para compartilhamento -->
    <meta name="description" content="CRM imobiliário para gestão de contatos, vendas e performance" />

    <!--
      Aplica o tema ANTES da primeira pintura.
      Sem isto o app pisca no tema errado: os tokens de :root são o tema escuro
      e a classe .light só entra depois que o React monta. Como o tema principal
      do Souza OS é o claro, o flash apareceria em toda abertura.
      Lê a mesma chave do zustand/persist (useThemeStore) — default: claro.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('icrm-theme')
          // Padrão da casa é o Marinho escuro, que já é o valor de :root —
          // sem nada gravado, não precisa fazer nada.
          if (!raw) return
          var saved = JSON.parse(raw)
          // Espelha a migração do useThemeStore (v2 = volta ao escuro). Sem
          // isto a tela pisca no tema errado antes do React montar.
          var theme = (saved.version || 0) < 2 ? 'dark' : (saved.state || {}).theme
          if (theme !== 'dark') document.documentElement.classList.add('light')
        } catch (e) { /* mantém o escuro de :root */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
