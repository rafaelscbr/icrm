<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Souza Imobiliária</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- PWA — Android / Chrome -->
    <meta name="theme-color" content="#0F2759" />

    <!-- Fontes Souza Imobiliária -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Plus Jakarta Sans (títulos e números de destaque) + Geist (interface) +
         Instrument Serif itálica (só a palavra de destaque, em dourado). Carregadas
         aqui, e não por @import no CSS: o @import só começava depois do CSS
         baixar e ser lido, o que atrasava a primeira pintura do texto. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500..800&family=Geist:wght@400..700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA — iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Souza Imobiliária" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Descrição para compartilhamento -->
    <meta name="description" content="CRM imobiliário para gestão de contatos, vendas e performance" />

    <!--
      Aplica o tema ANTES da primeira pintura.
      Sem isto o app pisca no tema errado: os tokens de :root são o tema escuro
      e a classe .light só entra depois que o React monta. Como o tema principal
      do Souza OS é o claro, o flash apareceria em toda abertura.
      Lê a mesma chave do zustand/persist (useThemeStore) — default: claro.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('icrm-theme')
          // v3 (02/11/2026): o padrão da casa passou a ser o CLARO — a
          // identidade Souza nasce dele. Sem nada gravado, ou gravado antes da
          // v3, entra claro. Espelha a migração do useThemeStore.
          if (!raw) { document.documentElement.classList.add('light'); return }
          var saved = JSON.parse(raw)
          var theme = (saved.version || 0) < 3 ? 'light' : (saved.state || {}).theme
          if (theme !== 'dark') document.documentElement.classList.add('light')
        } catch (e) { document.documentElement.classList.add('light') }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
